name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests (standard library only, no network)
        env:
          PYTHONIOENCODING: utf-8
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  without-tiers:
    name: The tests with the optional tiers deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Delete the three removable tiers and run everything else
        run: |
          rm mneme_llm/decide/micro.py mneme_llm/meaning/micro.py mneme_llm/meaning/unify.py
          python -W error::ResourceWarning -m unittest discover -s tests -t .

  stress:
    name: The stress tests, five times the default size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest tests.test_stress -v
        env:
          MNEME_STRESS: heavy

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          mneme-llm --version
          python -c "import mneme_llm, pathlib; assert (pathlib.Path(mneme_llm.__file__).parent / 'py.typed').is_file()"
